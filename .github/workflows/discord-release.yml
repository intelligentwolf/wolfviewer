# Announce a published release in the grid Discord, WITH the release notes.
#
# Why an Action instead of the plain GitHub -> Discord webhook: Discord's
# /github endpoint renders a release as a single line ("New release published:
# <tag>") and discards the body entirely -- GitHub does send it (verified: a
# 1414-character body delivered, one line displayed). Worse, the link it posts
# points at the repository, which is private, so it 404s for every grid member.
#
# This posts the actual notes as an embed, and links to where users can GET the
# thing rather than to source they cannot read.
name: Announce release on Discord

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an existing release to announce"
        required: true
      # [BETA CHANNEL 2026-11-12] No "kind" input on purpose: whether a tag is announced as a beta or as the release is
      # read from the release itself (its prerelease flag, below), so a beta tag cannot be announced as a release by
      # a mistaken or default choice, and nothing depends on which copy of this file GitHub reads the inputs from.

permissions:
  contents: read

jobs:
  announce:
    # [BETA CHANNEL 2026-11-12] Publishing a GitHub PRE-release (a beta, publish_beta.sh) does not post by itself:
    # betas and promotions are announced by starting this workflow by hand with the tag, and the job then reads from
    # the release whether it is a beta or the release. A full release published directly still announces itself.
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Post release notes to Discord
        env:
          WEBHOOK:  ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          REPO:     ${{ github.repository }}
          TAG:      ${{ github.event.release.tag_name || inputs.tag }}
          GET_IT:   "https://wolf-grid.com/viewers.php"
          WHO:      "WolfViewer"
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "::error::DISCORD_RELEASES_WEBHOOK secret is not set on this repository"
            exit 1
          fi
          rel=$(gh api "repos/$REPO/releases/tags/$TAG")
          title=$(printf '%s' "$rel" | jq -r '.name // .tag_name')
          body=$(printf '%s' "$rel"  | jq -r '.body // ""')
          # [BETA CHANNEL 2026-11-12] The release's own prerelease flag decides the kind of post. A GitHub PRE-release
          # is a beta (publish_beta.sh makes it one; promote_beta.sh clears the flag before it starts this workflow).
          pre=$(printf '%s' "$rel" | jq -r '.prerelease')
          case "$pre" in
            true)  KIND=beta ;;
            false) KIND=release ;;
            *) echo "::error::could not read the prerelease flag of $TAG (got '$pre'): nothing posted"; exit 1 ;;
          esac
          echo "announcing $TAG as: $KIND"
          # A beta post: short, says what it is, and points at the Beta section.
          if [ "$KIND" = "beta" ]; then
            GET_IT="https://wolf-grid.com/viewers.php#beta"
            WHO="WolfViewer Beta"
            title="Beta: $title"
            if [ "${#body}" -gt 900 ]; then
              body="$(printf '%s' "$body" | head -c 900)"$'\n\n…'
            fi
            body="$body"$'\n\n'"This is a beta for volunteers: tested, but it may have faults. Get it from the Beta section of the download page, or tick \"Get beta versions\" in Preferences > WolfViewer > Extras. Everyone else: no action needed, the full release follows."
          fi
          # Discord caps an embed description at 4096 characters.
          if [ "${#body}" -gt 3800 ]; then
            body="$(printf '%s' "$body" | head -c 3800)"$'\n\n…'
          fi
          jq -n --arg t "$title" --arg d "$body" --arg u "$GET_IT" --arg tag "$TAG" --arg who "$WHO" '{
            username: ($who + " Releases"),
            embeds: [{
              title: $t,
              description: $d,
              url: $u,
              color: 8702998,
              footer: { text: ($tag + " · " + $u) }
            }]
          }' > payload.json
          code=$(curl -sS -o resp.txt -w '%{http_code}' \
                   -H 'Content-Type: application/json' \
                   -X POST -d @payload.json "$WEBHOOK")
          echo "Discord responded: $code"
          [ -s resp.txt ] && cat resp.txt || true
          case "$code" in 200|204) ;; *) echo "::error::Discord rejected the post"; exit 1;; esac
