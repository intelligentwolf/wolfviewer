name: WolfViewer

on:
  # [2026-09-22] Pick a single platform when you are iterating. A push still builds them all.
  # Re-running one FAILED platform of an existing run needs no dispatch at all:
  #   gh run rerun --job <job-id> --repo intelligentwolf/wolfviewer
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        type: choice
        default: all
        # "linux" = both Linux builds plus the job that bundles them into one tarball.
        options: [all, linux, linux64, linux64-avx2, windows64, windows64-avx2, macos64]
  # [2026-10-07] Branch pushes only, no `tags: ["v*"]`. Creating the release tag started a SECOND
  # full build of the same commit (w59: 07:06-08:58Z, after the branch run 21:33-00:14Z), and from
  # cold, because a tag run cannot restore the branch's caches (0 ccache hits). It was unsigned as
  # well (WV_SIGN needs refs/heads/wolfviewer), so its artifacts were never the ones to ship. A
  # release publishes the branch run's artifacts (collect_artifacts.sh <run-id>).
  push:
    branches: ["wolfviewer"]

env:
  # [2026-10-02] NO "-wN" IN THE CHANNEL ANY MORE. viewer_manifest.py app_name() makes the
  # Windows INSTNAME (install folder, Start Menu folder, Add/Remove entry), the installed exe and
  # the macOS app name from the channel, so with "-wN" every release installed as a NEW program
  # beside the last one (Paul 10-02: "doing updates ... involves a re-install"). The release
  # number is `revision` below; the installer removes the old per-release installs
  # (installer_template.nsi RemoveOldReleaseInstalls). Hyphen, never a space: viewer_manifest.py
  # warns whitespace "break[s] a lot of things in the old FS installer logic".
  VIEWER_CHANNEL: "WolfViewer-Release"
  AUTOBUILD_CONFIG: "ReleaseOS"     # OpenSim edition, open codecs (no FMOD/KDU/secrets)
  # BuildVersion.cmake:14 reads ENV{revision} for the 4th version field (must be
  # numeric — viewerRes.rc:145 FILEVERSION). Pin to the wolf revision number so the
  # viewer reports 7.2.4.1 instead of a meaningless git commit count.
  revision: "61"
  # [2026-09-12] From here on a release has a NAME, and that is what residents see. The number
  # stays because it has to — viewerRes.rc:145 FILEVERSION must be numeric, and wolfupdate.cpp
  # compares it with the signed latest.json's "revision" — but it is no longer the thing anyone is
  # asked to quote. Tags stay v7.2.4-wN (w52 and older viewers read the GitHub tag).
  release_name: "Cloudy Condor"
  # [2026-09-29] Windows code signing (Azure Artifact Signing, account in Paul's Azure subscription,
  # resource group wolfviewer-signing). None of these are secrets. The endpoint must be the one for
  # the account's region, North Europe (how-to-signing-integrations endpoint table), and the
  # certificate CN is the validated legal name, so it is what every signature is checked against.
  ARTIFACT_SIGNING_ENDPOINT: "https://neu.codesigning.azure.net"
  ARTIFACT_SIGNING_ACCOUNT: "intelligentwolf-signing"
  ARTIFACT_SIGNING_PROFILE: "wolfviewer-public"
  SIGNING_SUBJECT_CN: "IntelligentWolf Ltd"

jobs:
  # [2026-09-22] The matrix is built here so workflow_dispatch can ask for ONE platform.
  # A push (or any dispatch asking for "all") gets the full set.
  # The entries live here and nowhere else.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        run: |
          # Second Windows flavour is compiled with MSVC /arch:AVX2 (00-Common.cmake:116).
          # viewer_manifest packages it with an "AVX2" name and ISAVX2=1, so its installer
          # refuses non-AVX2 CPUs and the plain installer offers it to AVX2 CPUs.
          # [2026-09-28] Second Linux flavour is compiled with -mavx2 (00-Common.cmake). It is
          # not a download of its own: linux-bundle below takes its viewer binary into the
          # linux64 tarball, and wrapper.sh runs it when /proc/cpuinfo lists avx2.
          ALL='[
            {"os":"ubuntu-22.04","name":"linux64","cmake_extra":""},
            {"os":"ubuntu-22.04","name":"linux64-avx2","cmake_extra":"-DUSE_AVX2_OPTIMIZATION:BOOL=ON"},
            {"os":"windows-2022","name":"windows64","cmake_extra":""},
            {"os":"windows-2022","name":"windows64-avx2","cmake_extra":"-DUSE_AVX2_OPTIMIZATION:BOOL=ON"},
            {"os":"macos-15","name":"macos64","cmake_extra":""}
          ]'
          WANT="${{ inputs.platform }}"
          if [ -z "$WANT" ] || [ "$WANT" = "all" ]; then
            M=$(echo "$ALL" | jq -c .)
          else
            M=$(echo "$ALL" | jq -c --arg n "$WANT" \
              '[.[] | select(.name == $n or ($n == "linux" and (.name | startswith("linux64"))))]')
            if [ "$(echo "$M" | jq 'length')" = "0" ]; then
              echo "::error::no platform named '$WANT'"; exit 1
            fi
          fi
          echo "building: $(echo "$M" | jq -r '[.[].name] | join(", ")')"
          echo "matrix=$M" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # id-token lets azure/login sign in to Azure with GitHub's OIDC token instead of a stored secret.
    permissions:
      contents: read
      id-token: write
    env:
      # [2026-09-29] Sign Windows builds of the wolfviewer branch once the repository variable
      # AZURE_CLIENT_ID exists. The Azure federated credential (app wolfviewer-ci-signing) trusts
      # only repo:intelligentwolf@15034842/wolfviewer@751350843:ref:refs/heads/wolfviewer (this repo
      # sends GitHub's immutable-ID subject), so a tag or another branch could not sign anyway;
      # they build unsigned. collect_artifacts.sh refuses an unsigned installer.
      WV_SIGN: ${{ startsWith(matrix.name, 'windows') && github.ref == 'refs/heads/wolfviewer' && vars.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libpulse-dev \
            build-essential python3-pip git libssl-dev libxinerama-dev libxrandr-dev \
            libfontconfig-dev libfreetype6-dev gcc-11 g++-11 cmake nsis
          echo "CC=gcc-11" >> $GITHUB_ENV
          echo "CXX=g++-11" >> $GITHUB_ENV

      - name: NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y

      # [2026-09-22] COMPILER CACHE. Every run used to compile the whole viewer from cold,
      # which is where the ~85 minutes went — the matrix was never the problem, the jobs have
      # always run in parallel on separate runners and fail-fast is off.
      #
      # ccache is content-addressed: it keys on the preprocessed source and the compiler
      # flags, so a stale entry cannot be returned for changed code. Safe for release builds.
      #
      # Linux and macOS only, deliberately. They are the long poles (1h25m and 1h22m against
      # Windows' 46-54m), and MSVC caching additionally needs the build switched from /Zi to
      # /Z7 for debug info to be cacheable — autobuild owns those flags, and getting it wrong
      # yields either a broken build or unusable PDBs. Not worth it for the fastest platform.
      - name: Compiler cache (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          # Per platform, and newest-first restore so a changed source file still starts from
          # the last good cache instead of from nothing.
          # [2026-10-07] "@" ends the platform name. With "-", linux64's restore prefix
          # "ccache-linux64-" also matched "ccache-linux64-avx2-...", so linux64 restored the AVX2
          # cache and got 0 hits (w59 branch run: "Cache restored from key: ccache-linux64-avx2-...").
          key: ccache-${{ matrix.name }}@${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.name }}@

      - name: Install ccache (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ccache; else sudo apt-get install -y ccache; fi
          ccache --max-size=5G
          ccache --zero-stats
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          # [2026-10-07] Precompiled headers. newview builds with target_precompile_headers
          # (newview/CMakeLists.txt:2396, USE_PRECOMPILED_HEADERS ON by default), and ccache
          # refuses a compile that uses a PCH unless told the PCH's defines and time macros may
          # be trusted, and refuses a header newer than the compile's start, which the .gch made
          # earlier in the same build always is. w59: 862 compiles "Uncacheable", so a run with
          # every cacheable call a hit still compiled for 69 minutes. The settings ccache's
          # manual gives for precompiled headers:
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install autobuild
        run: pip install -r requirements.txt

      - name: Build variables
        run: git clone --depth 1 https://github.com/FirestormViewer/fs-build-variables.git ../fs-build-variables

      - name: Autobuild env
        shell: bash
        run: |
          echo "AUTOBUILD_VARIABLES_FILE=$(cd ../fs-build-variables && pwd)/variables" >> $GITHUB_ENV
          echo "AUTOBUILD_VSVER=170" >> $GITHUB_ENV

      - name: Configure
        shell: bash
        run: |
          # [2026-09-22] Route the compilers through ccache where we installed it. Passed as
          # cmake launchers rather than by shadowing gcc in PATH, so the CC/CXX the Linux step
          # pins (gcc-11) still selects the compiler and ccache only wraps it.
          CACHE_ARGS=""
          if [ "$RUNNER_OS" != "Windows" ]; then
            CACHE_ARGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          fi
          autobuild configure -A 64 -c "$AUTOBUILD_CONFIG" -- \
            -DVIEWER_CHANNEL="$VIEWER_CHANNEL" -DLL_TESTS:BOOL=FALSE -DOPENSIM:BOOL=ON \
            -DHAVOK_TPV:BOOL=OFF $CACHE_ARGS ${{ matrix.cmake_extra }}

      - name: Build
        shell: bash
        run: autobuild build -A 64 -c "$AUTOBUILD_CONFIG" --no-configure

      # [2026-09-29] WINDOWS SIGNING, after the build rather than inside it: a GitHub OIDC login
      # expires 5 minutes after azure/login, far short of the ~50 minute build, so each signing
      # stage gets a fresh login right before it. Why, and what each stage does:
      # .github/scripts/wolfviewer-sign-windows.ps1.
      - name: "Signing: .NET 8 runtime for the Artifact Signing dlib"
        if: env.WV_SIGN == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: '8.0.x' }

      - name: "Signing: fetch signtool and dlib, find the build"
        if: env.WV_SIGN == 'true'
        shell: pwsh
        run: .github/scripts/wolfviewer-sign-windows.ps1 -Stage prepare

      - name: "Signing: Azure login (binaries)"
        if: env.WV_SIGN == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # The app's only role is Certificate Profile Signer on the signing account; it has no
          # subscription-level access, and signing needs none.
          allow-no-subscriptions: true

      - name: "Signing: sign viewer executables"
        if: env.WV_SIGN == 'true'
        shell: pwsh
        run: .github/scripts/wolfviewer-sign-windows.ps1 -Stage sign-binaries

      - name: "Signing: rebuild installer from the signed files"
        if: env.WV_SIGN == 'true'
        shell: pwsh
        run: .github/scripts/wolfviewer-sign-windows.ps1 -Stage repack

      - name: "Signing: Azure login (installer)"
        if: env.WV_SIGN == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # The app's only role is Certificate Profile Signer on the signing account; it has no
          # subscription-level access, and signing needs none.
          allow-no-subscriptions: true

      - name: "Signing: sign installer"
        if: env.WV_SIGN == 'true'
        shell: pwsh
        run: .github/scripts/wolfviewer-sign-windows.ps1 -Stage sign-installer

      - name: Cache stats (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: ccache --show-stats || true

      - name: Package
        shell: bash
        run: autobuild package -A 64 -c "$AUTOBUILD_CONFIG" --results-file result.txt || true

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          echo "--- searching workspace for installers ---"
          find . -type f \( \
            -iname '*Setup*.exe' -o -iname 'WolfViewer*.exe' -o \
            -iname '*.dmg' -o -iname '*.tar.zst' -o -iname '*.tar.bz2' -o -iname '*.tar.xz' -o \
            -iname '*.pkg' -o -iname 'result.txt' \) \
            -not -path '*/.git/*' -print 2>/dev/null | tee /tmp/found.txt
          while IFS= read -r f; do [ -n "$f" ] && cp -v "$f" dist/ 2>/dev/null || true; done < /tmp/found.txt
          echo "--- dist contents ---"; ls -la dist || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WolfViewer-${{ matrix.name }}
          path: dist/**
          # [2026-09-12] error, NOT warn. With "warn" a build that produced no installer still
          # went GREEN and simply uploaded nothing — which is how the Windows AVX2 download was
          # absent from the website from w21 until somebody happened to notice. A platform that
          # builds nothing is a failed release, and it should look like one.
          if-no-files-found: error

  # [2026-09-28] ONE Linux download that runs the AVX2 build where the CPU has it. The two Linux
  # builds run side by side above; this takes the viewer binary out of the AVX2 tarball and adds
  # it to the standard tarball as bin/do-not-directly-run-wolfviewer-bin-avx2. It must sit in bin/
  # beside the other: the viewer finds SLPlugin, chrome-sandbox, SLVoice and the crash logger
  # relative to its own directory (lldir_linux.cpp mExecutableDir). wrapper.sh does the choosing.
  linux-bundle:
    needs: [plan, build]
    if: ${{ !cancelled() && contains(needs.plan.outputs.matrix, '"linux64"') && contains(needs.plan.outputs.matrix, '"linux64-avx2"') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: { name: WolfViewer-linux64, path: in/legacy }
      - uses: actions/download-artifact@v4
        with: { name: WolfViewer-linux64-avx2, path: in/avx2 }

      - name: Add the AVX2 viewer binary to the standard tarball
        shell: bash
        run: |
          set -euo pipefail
          one() {
            local h; mapfile -t h < <(find "$1" -maxdepth 1 -type f -name "$2")
            [ "${#h[@]}" -eq 1 ] || { echo "::error::expected one $2 in $1, found ${#h[@]}" >&2; exit 1; }
            echo "${h[0]}"
          }
          # fs_viewer_manifest.py fs_installer_basename(): _LEGACY- or _AVX2- names the flavour.
          LEG=$(one in/legacy '*_LEGACY-*.tar.xz')
          AVX=$(one in/avx2 '*_AVX2-*.tar.xz')
          TOP=$(basename "$LEG" .tar.xz)
          ATOP=$(basename "$AVX" .tar.xz)
          # Same channel and version on both sides, or the pair came from different commits.
          [ "${TOP/_LEGACY-/_AVX2-}" = "$ATOP" ] || { echo "::error::$TOP and $ATOP do not match"; exit 1; }

          mkdir work
          tar -C work -xpf "$LEG"
          BIN="work/$TOP/bin/do-not-directly-run-wolfviewer-bin"
          test -x "$BIN"
          tar -xOf "$AVX" "$ATOP/bin/do-not-directly-run-wolfviewer-bin" > "$BIN-avx2"
          chmod 755 "$BIN-avx2"

          # The AVX2 build must really be the AVX2 build: a different file, with far more
          # 256-bit (ymm) instructions than the standard one.
          cmp -s "$BIN" "$BIN-avx2" && { echo "::error::the two viewer binaries are identical"; exit 1; }
          ymm() { objdump -d --no-show-raw-insn "$1" | grep -c ymm || true; }
          L=$(ymm "$BIN"); A=$(ymm "$BIN-avx2")
          echo "ymm instructions: standard $L, avx2 $A"
          [ "$A" -gt $(( L * 2 + 1000 )) ] || { echo "::error::avx2 binary does not look AVX2-compiled"; exit 1; }

          mkdir -p dist
          # Same tar options as viewer_manifest.py LinuxManifest.package_finish().
          XZ_OPT=-T0 tar -C work --numeric-owner -caf "dist/$TOP.tar.xz" "$TOP"
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WolfViewer-linux64-bundle
          path: dist/**
          if-no-files-found: error

  # [2026-10-02] The Linux packages (.deb, .rpm, .pkg.tar.zst) built from the bundle tarball, each
  # in its own distribution's container with its own tools, and each installed into a clean
  # container of that family before it is uploaded. Signing and the repositories at
  # wolf-grid.com/linux/ are NOT done here: ~/wolfviewer-releases/publish_linux_repos.sh signs with
  # the key that never leaves Paul's machine, from this job's artifact WolfViewer-linux-packages.
  # The deb is built on Ubuntu 22.04 (the oldest supported) so its Depends name the oldest
  # library versions; the same recipe made the w53 packages by hand (build_linux_packages_w53.sh).
  linux-packages:
    needs: [linux-bundle]
    if: ${{ !cancelled() && needs.linux-bundle.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with: { name: WolfViewer-linux64-bundle, path: in }

      - name: Build and install-test deb, rpm and arch packages
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t T < <(find in -maxdepth 1 -type f -name '*.tar.xz')
          [ "${#T[@]}" -eq 1 ] || { echo "::error::expected one bundle tarball, found ${#T[@]}"; exit 1; }
          TB=$(basename "${T[0]}")
          # fs_viewer_manifest.py names it ..._LEGACY-7-2-4-53.tar.xz: the version is the last four numbers.
          V=$(basename "$TB" .tar.xz | sed -nE 's/.*-([0-9]+)-([0-9]+)-([0-9]+)-([0-9]+)$/\1.\2.\3.\4/p')
          [ -n "$V" ] || { echo "::error::no version in $TB"; exit 1; }
          echo "bundle $TB, package version $V"
          IN="$PWD/in"; S="$PWD/.github/scripts"; OUT="$PWD/packages"; mkdir -p "$OUT"
          U="$(id -u):$(id -g)"

          echo "::group::deb (Ubuntu 22.04)"
          docker run --rm -v "$IN:/in:ro" -v "$OUT:/out" -v "$S:/s:ro" ubuntu:22.04 bash -c "set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update >/dev/null; apt-get install -y dpkg-dev file binutils xz-utils >/dev/null
            /s/wolfviewer-deb-runtime-libs.sh /in/$TB
            /s/wolfviewer-linux-packages.sh deb /in/$TB $V /out
            chown -R $U /out"
          echo "::endgroup::"

          echo "::group::rpm (Fedora)"
          docker run --rm -v "$IN:/in:ro" -v "$OUT:/out" -v "$S:/s:ro" fedora:latest bash -c "set -euo pipefail
            dnf -y -q install rpm-build file binutils findutils xz tar >/dev/null
            /s/wolfviewer-linux-packages.sh rpm /in/$TB $V /out
            chown -R $U /out"
          echo "::endgroup::"

          echo "::group::arch (Arch Linux, makepkg as a normal user)"
          docker run --rm -v "$IN:/in:ro" -v "$OUT:/out" -v "$S:/s:ro" archlinux:latest bash -c "set -euo pipefail
            pacman -Syu --noconfirm --needed base-devel file binutils >/dev/null
            pacman -Fy >/dev/null
            useradd -m b; mkdir -p /tmp/o; chown b /tmp/o
            su b -c '/s/wolfviewer-linux-packages.sh arch /in/$TB $V /tmp/o'
            cp /tmp/o/*.pkg.tar.zst /out/; chown -R $U /out"
          echo "::endgroup::"

          # The names publish_linux_repos.sh takes.
          for f in "wolfviewer_${V}_amd64.deb" "wolfviewer-${V}-1.x86_64.rpm" "wolfviewer-${V}-1-x86_64.pkg.tar.zst"; do
            [ -s "$OUT/$f" ] || { echo "::error::missing $f"; ls -la "$OUT"; exit 1; }
          done

          # Each package into a clean system of its family; every library both viewer binaries
          # need must resolve (the bundle's own lib/ first, as wrapper.sh sets it).
          # (Not "! ldd | grep": set -e ignores a negated pipeline, so a miss would still pass.)
          LDD='LD_LIBRARY_PATH=/opt/wolfviewer/lib ldd /opt/wolfviewer/bin/do-not-directly-run-wolfviewer-bin /opt/wolfviewer/bin/do-not-directly-run-wolfviewer-bin-avx2 > /tmp/ldd.txt
            if grep "not found" /tmp/ldd.txt; then echo "::error::missing libraries"; exit 1; fi'
          echo "::group::install tests"
          docker run --rm -v "$OUT:/out:ro" ubuntu:22.04 bash -c "set -euo pipefail; export DEBIAN_FRONTEND=noninteractive
            apt-get update >/dev/null; apt-get install -y /out/wolfviewer_${V}_amd64.deb >/dev/null; $LDD; echo deb OK"
          docker run --rm -v "$OUT:/out:ro" fedora:latest bash -c "set -euo pipefail
            dnf -y -q install /out/wolfviewer-${V}-1.x86_64.rpm >/dev/null; $LDD; echo rpm OK"
          docker run --rm -v "$OUT:/out:ro" archlinux:latest bash -c "set -euo pipefail
            pacman -Sy --noconfirm >/dev/null; pacman -U --noconfirm /out/wolfviewer-${V}-1-x86_64.pkg.tar.zst >/dev/null; $LDD; echo arch OK"
          echo "::endgroup::"
          ls -la "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WolfViewer-linux-packages
          path: packages/*
          if-no-files-found: error
